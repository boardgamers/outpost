name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (oxfmt)
        run: pnpm fmt:check

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Typecheck (engine tsc + viewer svelte-check)
        run: pnpm tsc

      - name: Test (engine)
        run: pnpm test

      - name: Build (engine + viewer)
        run: pnpm build
