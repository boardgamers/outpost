name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: docker
    # Image pinned so CI does not depend on the runner's default-image mapping
    # for the "docker" label; node:24-bookworm ships node + corepack (pnpm).
    container:
      image: docker.io/library/node:24-bookworm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      # Corepack fetches the pnpm version pinned by package.json's
      # packageManager field.
      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (oxfmt)
        run: pnpm fmt:check

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Build engine (needed for viewer typecheck)
        run: pnpm --filter outpost-engine build

      - name: Typecheck (engine tsc + viewer svelte-check)
        run: pnpm tsc

      - name: Test (engine)
        run: pnpm test

      - name: Build (engine + viewer)
        run: pnpm build
